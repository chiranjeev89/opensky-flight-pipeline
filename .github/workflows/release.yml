name: Release

# CD: when a version tag is pushed (e.g. v1.0.0), build the two Docker images
# that CI already verifies and publish them to GitHub Container Registry, so any
# machine can run the exact released version with `docker pull`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io with the built-in GITHUB_TOKEN (no extra secrets)

jobs:
  publish-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: airflow
            dockerfile: docker/airflow.Dockerfile
          - name: dashboard
            dockerfile: docker/dashboard.Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opensky-flight-pipeline-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
