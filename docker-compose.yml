# Full local stack: Postgres (Airflow metadata), Azurite (Azure Blob emulator),
# Airflow 3 (api-server, scheduler, dag-processor), Streamlit dashboard.
# Switch to real Azure by setting AZURE_STORAGE_CONNECTION_STRING in .env.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-local-only}
    # BUG-005: option lives in [core]. ALL_ADMINS = no login screen: LOCAL ONLY (THREAT T-07)
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    LOCAL_LAKE_DIR: /opt/lake
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./dbt:/opt/airflow/dbt
    - lake:/opt/lake
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    azurite:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports: ["10000:10000"]
    volumes: [azurite-data:/data]

  # BUG-008: split in two. Airflow's Python packages live under /home/airflow/.local,
  # so running `airflow` as root fails with "No module named 'airflow'".
  # lake-init does the root-only chown; airflow-init migrates the DB as the airflow user.
  lake-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/lake /opt/airflow/logs
        chown -R ${AIRFLOW_UID:-50000}:0 /opt/lake || true
        chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/logs || true   # may be ignored on Windows mounts
        echo "lake volume ready"
    user: "0:0"
    restart: "no"

  airflow-init:
    <<: *airflow-common
    command: ["db", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      lake-init:
        condition: service_completed_successfully

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    depends_on:
      lake-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      SERVING_DB_PATH: /opt/lake/serving.duckdb
    volumes:
      - lake:/opt/lake:ro   # read-only mount: dashboard cannot modify data
    ports: ["8501:8501"]

volumes:
  pg-data:
  azurite-data:
  lake:
